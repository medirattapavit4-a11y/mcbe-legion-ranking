<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MCBE TIERS</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #05070c;
    color: white;
    min-height: 100vh;
    overflow-x: hidden;
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -2;
    background:
        radial-gradient(circle at 15% 15%, rgba(0,255,170,.13), transparent 28%),
        radial-gradient(circle at 85% 65%, rgba(0,200,255,.10), transparent 28%),
        linear-gradient(135deg, #020509, #07100f, #03060b);
}

body::after {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -1;
    opacity: .22;
    background-image:
        linear-gradient(rgba(0,255,170,.07) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,255,170,.07) 1px, transparent 1px);
    background-size: 45px 45px;
}

.header {
    height: 75px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 25px;
    border-bottom: 1px solid rgba(255,255,255,.08);
    background: rgba(3,7,12,.88);
    backdrop-filter: blur(12px);
}

.logo {
    font-size: 23px;
    font-weight: 900;
    letter-spacing: 2px;
}

.logo span {
    color: #00ff9d;
}

.menu {
    font-size: 26px;
    color: #8791a3;
}

.container {
    width: min(1000px, 94%);
    margin: auto;
    padding: 35px 0 60px;
}

.hero {
    text-align: center;
    margin-bottom: 30px;
}

.hero h1 {
    font-size: clamp(38px, 8vw, 70px);
    font-weight: 900;
    letter-spacing: 3px;
    color: #00ffb3;
    text-shadow: 0 0 28px rgba(0,255,180,.42);
}

.hero p {
    margin-top: 10px;
    color: #8d9aaa;
    font-size: 16px;
}

.stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 15px;
    margin-bottom: 25px;
}

.stat {
    padding: 23px 15px;
    text-align: center;
    border: 1px solid rgba(0,255,180,.12);
    border-radius: 20px;
    background: rgba(17,20,32,.82);
    box-shadow: 0 10px 35px rgba(0,0,0,.25);
}

.stat-number {
    font-size: 28px;
    color: #00ff9d;
    font-weight: 900;
}

.stat-name {
    margin-top: 7px;
    color: #687286;
    font-size: 11px;
    letter-spacing: 2px;
}

.tabs {
    display: flex;
    gap: 8px;
    padding: 8px;
    background: rgba(17,20,32,.9);
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 20px;
    margin-bottom: 18px;
}

.tab {
    flex: 1;
    border: none;
    padding: 14px 8px;
    border-radius: 14px;
    background: transparent;
    color: #697287;
    font-size: 14px;
}

.tab.active {
    background: rgba(0,255,170,.12);
    color: #00ff9d;
}

.search {
    width: 100%;
    padding: 18px;
    border-radius: 17px;
    border: 1px solid rgba(255,255,255,.08);
    outline: none;
    background: rgba(14,17,27,.92);
    color: white;
    font-size: 16px;
    margin-bottom: 12px;
}

.search:focus {
    border-color: rgba(0,255,170,.5);
}

.filter-row {
    display: flex;
    gap: 12px;
    margin-bottom: 25px;
}

.filter {
    flex: 1;
    padding: 16px;
    border-radius: 16px;
    border: 1px solid rgba(255,255,255,.08);
    background: rgba(14,17,27,.95);
    color: #cbd2df;
    font-size: 15px;
    outline: none;
}

.filter:focus {
    border-color: rgba(0,255,170,.45);
}

.ranking {
    display: flex;
    align-items: center;
    gap: 17px;
    padding: 19px;
    margin-bottom: 11px;
    border-radius: 20px;
    background: rgba(18,20,31,.92);
    border: 1px solid rgba(255,255,255,.07);
    transition: .2s;
}

.ranking:hover {
    transform: translateY(-2px);
    border-color: rgba(0,255,170,.25);
}

.position {
    width: 42px;
    font-size: 19px;
    font-weight: 900;
    color: #7f899b;
    text-align: center;
}

.player {
    flex: 1;
}

.player-name {
    font-size: 19px;
    font-weight: 800;
}

.player-info {
    margin-top: 5px;
    color: #687286;
    font-size: 13px;
}

.tier {
    padding: 9px 13px;
    border-radius: 10px;
    background: rgba(0,255,170,.08);
    color: #00ff9d;
    border: 1px solid rgba(0,255,170,.12);
    font-weight: 900;
    font-size: 13px;
}

.points {
    color: #8e98aa;
    font-size: 12px;
    margin-top: 5px;
    text-align: right;
}

.section-title {
    color: #8b95a8;
    font-size: 12px;
    letter-spacing: 2px;
    margin-bottom: 12px;
}

@media(max-width:650px) {

    .stats {
        grid-template-columns: repeat(2, 1fr);
    }

    .header {
        padding: 0 18px;
    }

    .container {
        padding-top: 25px;
    }

    .ranking {
        gap: 9px;
        padding: 15px;
    }

    .player-name {
        font-size: 16px;
    }

    .position {
        width: 28px;
    }

    .tier {
        padding: 7px 9px;
        font-size: 12px;
    }

    .filter-row {
        flex-direction: column;
    }

    .tabs {
        overflow-x: auto;
    }

    .tab {
        min-width: 90px;
    }
}
</style>
</head>

<body>

<header class="header">
    <div class="logo">
        <span>MCBE</span> TIERS
    </div>

    <div class="menu">☰</div>
</header>

<main class="container">

    <section class="hero">
        <h1>MCBE TIERS</h1>
        <p>The ultimate Bedrock Edition PvP ranking system</p>
    </section>

    <section class="stats">

        <div class="stat">
            <div class="stat-number">3</div>
            <div class="stat-name">PLAYERS</div>
        </div>

        <div class="stat">
            <div class="stat-number">2850</div>
            <div class="stat-name">TOTAL PTS</div>
        </div>

        <div class="stat">
            <div class="stat-number">950</div>
            <div class="stat-name">AVG PTS</div>
        </div>

        <div class="stat">
            <div class="stat-number">1000</div>
            <div class="stat-name">TOP PTS</div>
        </div>

    </section>

    <section class="tabs">

        <button class="tab active">🌐 Overall</button>
        <button class="tab">📱 Mobile</button>
        <button class="tab">🖥️ PC</button>
        <button class="tab">🎮 Console</button>

    </section>

    <input
        class="search"
        id="search"
        type="text"
        placeholder="Search player IGN..."
    >

    <div class="filter-row">

        <select class="filter" id="gamemode">
            <option value="all">Select Gamemode</option>
            <option value="builduhc">BuildUHC</option>
            <option value="midfight">MidFight/SWORD</option>
            <option value="skywars">SkyWars</option>
            <option value="crystal">Crystal PvP</option>
        </select>
        <select class="filter" id="region">
            <option value="all">Select Region</option>
            <option value="AS">Asia</option>
            <option value="EU">Europe</option>
            <option value="NA">North America</option>
            <option value="SA">South America</option>
            <option value="OC">Oceania</option>
        </select>

    </div>

    <div class="section-title">
        PLAYER RANKINGS
    </div>

    <section id="rankings">

        <div class="ranking">
            <div class="position">#1</div>

            <div class="player">
                <div class="player-name">Efficient</div>
                <div class="player-info">AS • SkyWars</div>
            </div>

            <div>
                <div class="tier">HT1</div>
                <div class="points">1000 pts</div>
            </div>
        </div>

        <div class="ranking">
            <div class="position">#2</div>

            <div class="player">
                <div class="player-name">Nanchi</div>
                <div class="player-info">AS • SkyWars</div>
            </div>

            <div>
                <div class="tier">LT1</div>
                <div class="points">950 pts</div>
            </div>
        </div>

        <div class="ranking">
            <div class="position">#3</div>

            <div class="player">
                <div class="player-name">NOT KILLER</div>
                <div class="player-info">AS • MidFight</div>
            </div>

            <div>
                <div class="tier">HT2</div>
                <div class="points">900 pts</div>
            </div>
        </div>

    </section>

</main>

<script>

const search = document.getElementById("search");
const gamemode = document.getElementById("gamemode");
const region = document.getElementById("region");
const rankings = document.querySelectorAll(".ranking");

function filterPlayers() {

    const searchValue = search.value.toLowerCase();
    const modeValue = gamemode.value;
    const regionValue = region.value;

    rankings.forEach(card => {

        const name =
            card.querySelector(".player-name")
            .textContent
            .toLowerCase();

        const info =
            card.querySelector(".player-info")
            .textContent
            .toLowerCase();

        const nameMatch = name.includes(searchValue);

        const modeMatch =
            modeValue === "all" ||
            info.includes(modeValue);

        const regionMatch =
            regionValue === "all" ||
            info.includes(regionValue.toLowerCase());

        card.style.display =
            nameMatch && modeMatch && regionMatch
            ? "flex"
            : "none";
    });
}

search.addEventListener("input", filterPlayers);
gamemode.addEventListener("change", filterPlayers);
region.addEventListener("change", filterPlayers);

</script>

</body>
</html>
