<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MCBE TIERS</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #05070c;
    color: white;
    min-height: 100vh;
    overflow-x: hidden;
}

/* Background */
body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -2;
    background:
        radial-gradient(circle at 20% 20%, rgba(0,255,170,.12), transparent 25%),
        radial-gradient(circle at 80% 60%, rgba(0,200,255,.10), transparent 25%),
        linear-gradient(135deg, #020509, #07100f, #03060b);
}

body::after {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -1;
    opacity: .25;
    background-image:
        linear-gradient(rgba(0,255,170,.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,255,170,.08) 1px, transparent 1px);
    background-size: 45px 45px;
}

/* Header */
.header {
    height: 75px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 25px;
    border-bottom: 1px solid rgba(255,255,255,.08);
    background: rgba(3,7,12,.85);
    backdrop-filter: blur(12px);
}

.logo {
    font-size: 23px;
    font-weight: 900;
    letter-spacing: 2px;
}

.logo span {
    color: #00ff9d;
}

.menu {
    font-size: 28px;
}

/* Main */
.container {
    width: min(1000px, 94%);
    margin: auto;
    padding: 35px 0 60px;
}

.hero {
    text-align: center;
    margin-bottom: 30px;
}

.hero h1 {
    font-size: clamp(38px, 8vw, 70px);
    font-weight: 900;
    letter-spacing: 3px;
    color: #00ffb3;
    text-shadow: 0 0 25px rgba(0,255,180,.45);
}

.hero p {
    margin-top: 10px;
    color: #8d9aaa;
    font-size: 17px;
}

/* Stats */
.stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 15px;
    margin-bottom: 30px;
}

.stat {
    padding: 25px 15px;
    text-align: center;
    border: 1px solid rgba(0,255,180,.12);
    border-radius: 22px;
    background: rgba(17,20,32,.8);
    box-shadow: 0 10px 35px rgba(0,0,0,.25);
}

.stat-number {
    font-size: 28px;
    color: #00ff9d;
    font-weight: 900;
}

.stat-name {
    margin-top: 8px;
    color: #596276;
    font-size: 12px;
    letter-spacing: 2px;
}

/* Device tabs */
.tabs {
    display: flex;
    gap: 8px;
    padding: 8px;
    background: rgba(17,20,32,.9);
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 22px;
    margin-bottom: 20px;
}

.tab {
    flex: 1;
    border: none;
    padding: 15px 8px;
    border-radius: 16px;
    background: transparent;
    color: #697287;
    font-size: 14px;
    cursor: pointer;
}

.tab.active {
    background: rgba(0,255,170,.12);
    color: #00ff9d;
    box-shadow: 0 0 20px rgba(0,255,170,.08);
}

/* Search */
.search {
    width: 100%;
    padding: 20px;
    border-radius: 20px;
    border: 1px solid rgba(255,255,255,.08);
    outline: none;
    background: rgba(14,17,27,.9);
    color: white;
    font-size: 17px;
    margin-bottom: 20px;
}

.search:focus {
    border-color: #00ff9d;
}

/* Gamemodes */
.gamemodes {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    padding: 18px;
    border-radius: 22px;
    background: rgba(15,18,29,.9);
    border: 1px solid rgba(255,255,255,.07);
    margin-bottom: 25px;
}

.mode {
    flex: 1;
    min-width: 70px;
    padding: 12px;
    text-align: center;
    border-radius: 14px;
    background: rgba(255,255,255,.03);
    cursor: pointer;
    font-size: 25px;
    transition: .2s;
}

.mode:hover,
.mode.active {
    background: rgba(0,255,170,.12);
    transform: translateY(-2px);
}

/* Rankings */
.ranking {
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 20px;
    margin-bottom: 12px;
    border-radius: 22px;
    background: rgba(18,20,31,.9);
    border: 1px solid rgba(255,255,255,.07);
    transition: .2s;
}

.ranking:hover {
    transform: translateY(-2px);
    border-color: rgba(0,255,170,.25);
}

.position {
    width: 45px;
    font-size: 20px;
    font-weight: bold;
    color: #8b94a6;
}

.player {
    flex: 1;
}

.player-name {
    font-size: 20px;
    font-weight: 800;
}

.player-info {
    margin-top: 5px;
    color: #697287;
    font-size: 14px;
}

.tier {
    padding: 10px 15px;
    border-radius: 12px;
    background: rgba(255,255,255,.06);
    font-weight: 900;
    color: #00ff9d;
}

.points {
    color: #9ca4b5;
    font-size: 14px;
    margin-top: 6px;
    text-align: right;
}

/* Mobile */
@media(max-width: 650px) {

    .stats {
        grid-template-columns: repeat(2, 1fr);
    }

    .header {
        padding: 0 18px;
    }

    .container {
        padding-top: 25px;
    }

    .ranking {
        gap: 10px;
    }

    .player-name {
        font-size: 17px;
    }

    .position {
        width: 30px;
    }

    .tier {
        padding: 8px 10px;
        font-size: 13px;
    }

    .tabs {
        overflow-x: auto;
    }

    .tab {
        min-width: 90px;
    }
}
</style>
</head>

<body>

<header class="header">
    <div class="logo">
        <span>MCBE</span> TIERS
    </div>

    <div class="menu">☰</div>
</header>

<main class="container">

    <section class="hero">
        <h1>MCBE TIERS</h1>
        <p>The ultimate Bedrock Edition PvP ranking system</p>
    </section>

    <section class="stats">

        <div class="stat">
            <div class="stat-number">3</div>
            <div class="stat-name">PLAYERS</div>
        </div>

        <div class="stat">
            <div class="stat-number">2850</div>
            <div class="stat-name">TOTAL PTS</div>
        </div>

        <div class="stat">
            <div class="stat-number">950</div>
            <div class="stat-name">AVG PTS</div>
        </div>

        <div class="stat">
            <div class="stat-number">1000</div>
            <div class="stat-name">TOP PTS</div>
        </div>

    </section>

    <section class="tabs">

        <button class="tab active">🌐 Overall</button>
        <button class="tab">📱 Mobile</button>
        <button class="tab">🖥️ PC</button>
        <button class="tab">🎮 Console</button>

    </section>

    <input
        class="search"
        id="search"
        type="text"
        placeholder="Search player IGN..."
    >

    <section class="gamemodes">

        <div class="mode active">🌐</div>
        <div class="mode">🟢</div>
        <div class="mode">🧪</div>
        <div class="mode">👾</div>
        <div class="mode">🔨</div>
        <div class="mode">🍊</div>
        <div class="mode">⚔️</div>
        <div class="mode">🏹</div>
        <div class="mode">🪄</div>
        <div class="mode">💜</div>
        <div class="mode">❤️</div>

    </section>

    <section id="rankings">

        <div class="ranking">
            <div class="position">#1</div>

            <div class="player">
                <div class="player-name">Efficient</div>
                <div class="player-info">AS • SkyWars</div>
            </div>

            <div>
                <div class="tier">HT1</div>
                <div class="points">1000 pts</div>
            </div>
        </div>

        <div class="ranking">
            <div class="position">#2</div>

            <div class="player">
                <div class="player-name">Nanchi</div>
                <div class="player-info">AS • SkyWars</div>
            </div>

            <div>
                <div class="tier">LT1</div>
                <div class="points">950 pts</div>
            </div>
        </div>

        <div class="ranking">
            <div class="position">#3</div>

            <div class="player">
                <div class="player-name">NOT KILLER</div>
                <div class="player-info">AS • MidFight</div>
            </div>

            <div>
                <div class="tier">HT2</div>
                <div class="points">900 pts</div>
            </div>
        </div>

    </section>

</main>

<script>
const search = document.getElementById("search");
const rankings = document.querySelectorAll(".ranking");

search.addEventListener("input", () => {

    const value = search.value.toLowerCase();

    rankings.forEach(card => {

        const name =
            card.querySelector(".player-name")
            .textContent
            .toLowerCase();

        card.style.display =
            name.includes(value) ? "flex" : "none";

    });

});
</script>

</body>
</html>
